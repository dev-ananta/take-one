name: Build TakeOne APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TakeOne.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakeOne-apk
          path: TakeOne.apk

      - name: Publish APK as a release (direct phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TakeOne build ${{ github.run_number }}
          files: TakeOne.apk
